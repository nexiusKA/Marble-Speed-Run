name: Android AAB Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm run test:regression
        env:
          RELEASE_CHECK: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

      - name: Run browser tests (E2E)
        run: |
          npm run build
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build web assets and sync Android
        run: npm run cap:sync:android
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Validate signing secrets
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare keystore and build signed AAB
        run: |
          set -euo pipefail
          # Strip stray spaces / line breaks that sneak in when pasting secrets.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PW="$(trim "$RAW_KEYSTORE_PASSWORD")"
          KEY_PW="$(trim "$RAW_KEY_PASSWORD")"
          ALIAS="$(trim "$RAW_KEY_ALIAS")"
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"

          printf '%s' "$RAW_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > /tmp/release-key.jks

          # Check keystore + password + alias before the long Gradle build,
          # and report problems as a readable annotation.
          if ! keytool -list -keystore /tmp/release-key.jks -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>/tmp/keytool.err; then
            echo "::error title=Signing key check failed::$(grep -v '^Picked up' /tmp/keytool.err | head -3 | tr '\n' ' ') – check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets."
            exit 1
          fi
          echo "Signing key check passed (alias: $ALIAS)"

          export ANDROID_KEYSTORE_PATH=/tmp/release-key.jks
          export ANDROID_KEYSTORE_PASSWORD="$STORE_PW"
          export ANDROID_KEY_ALIAS="$ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_PW"

          cd android
          if ! ./gradlew bundleRelease 2>&1 | tee /tmp/gradle.log; then
            # Surface Gradle's "What went wrong" block as an annotation
            msg="$(sed -n '/What went wrong/,/\* Try/p' /tmp/gradle.log | grep -v -e 'What went wrong' -e '\* Try' -e 'Deprecated Gradle' -e 'warning-mode' -e 'For more on this' | head -8 | tr '\n' ' ')"
            echo "::error title=Gradle build failed::${msg:-see log}"
            exit 1
          fi
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RAW_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: marble-rush-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
