name: Android Smoke Test

# Builds a debug APK, launches it on an Android emulator, and records a
# screenshot plus the app log. Results are pushed to the `smoke-results-api<level>`
# branches so they can be inspected without downloading artifacts.
on:
  push:
    branches: ['diag/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29, 34, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check for older WebViews (ES2019)
        run: |
          npm install --no-save acorn@8.14.0
          npm run test:syntax

      - name: Build web assets and sync Android
        run: npm run cap:sync:android

      - name: List web assets copied into the Android project
        run: |
          ls -la android/app/src/main/assets/ || true
          find android/app/src/main/assets -maxdepth 2 | head -40 || true

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 34 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-smoke.sh

      - name: Publish results to smoke-results branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r smoke-out/. /tmp/out/ 2>/dev/null || true
          cp -r android/app/src/main/assets /tmp/out/assets-listing 2>/dev/null && find /tmp/out/assets-listing -type f | sed 's#/tmp/out/assets-listing/##' > /tmp/out/assets.txt && rm -rf /tmp/out/assets-listing || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan smoke-results-api${{ matrix.api-level }}
          git rm -rf -q . || true
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/out/. .
          echo "run: ${{ github.run_id }} sha: ${{ github.sha }} api: ${{ matrix.api-level }}" > RUN.txt
          git add -A
          git commit -q -m "Smoke results for ${{ github.sha }}"
          git push -f origin smoke-results-api${{ matrix.api-level }}
